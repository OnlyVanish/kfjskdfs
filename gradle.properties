org.gradle.jvmargs=-Xmx1700m -XX:MaxMetaspaceSize=640m -XX:+UseSerialGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 runs Kotlin through its own built-in support; kapt (Hilt + Room) is not
# compatible with that yet. Until the project migrates Hilt/Room to KSP, keep the
# Kotlin Gradle plugin in charge — this is the bypass AGP's own diagnostic names.
android.builtInKotlin=false
android.newDsl=false

kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
org.gradle.parallel=false
